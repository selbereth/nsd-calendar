name: Sync schedule

on:
  schedule:
    - cron: "17 13 * * *"   # daily, ~6am Pacific
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python3 tests/test_sheet_to_ics.py
      - name: Build calendars from the sheet
        run: python3 sheet_to_ics.py --out docs
      - name: Commit if changed
        run: |
          # also keeps the repo "active" so GitHub does not pause the schedule after 60 days
          date -u +"%Y-%m-%d" > docs/last-checked.txt
          git config user.name "nsd-calendar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "Update calendar $(date -u +%F)"
          git push
